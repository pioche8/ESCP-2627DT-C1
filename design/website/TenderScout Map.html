<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TenderScout · Where you bid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
html,body{margin:0;height:100%;background:#07090D;color:#F4F5F7;font-family:'Hanken Grotesk',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:#7CC6F8}a:hover{color:#fff}
#wrap{position:relative;width:100%;height:100%}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;left:20px;top:20px;width:244px;padding:18px;border-radius:20px;background:rgba(14,18,26,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 20px 40px -20px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.t{font:800 21px/25px 'Hanken Grotesk';letter-spacing:-.03em}
.m{margin-top:4px;font:500 11px/15px 'IBM Plex Mono';color:#7E8591}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);font:600 13px/17px 'Hanken Grotesk';cursor:pointer;user-select:none}
.sw{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:#5DB8F5;transition:background .2s}
.sw i{position:absolute;top:3px;left:21px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .25s cubic-bezier(.2,.9,.25,1.2)}
.off .sw{background:#2A303B}.off .sw i{left:3px}
.counts{display:flex;gap:5px}
.counts div{height:46px;border-radius:12px;padding:8px 9px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;font:700 11px/1 'Hanken Grotesk';transition:flex .45s cubic-bezier(.2,.8,.2,1);min-width:0;overflow:hidden;white-space:nowrap}
.counts b{font:800 18px/1 'Hanken Grotesk'}
#tip{position:absolute;pointer-events:none;width:230px;padding:14px;border-radius:16px;background:#F4F5F7;color:#0E1B2B;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,calc(-100% - 18px)) scale(.97);transition:opacity .15s,transform .15s;box-sizing:border-box}
#tip.on{opacity:1;transform:translate(-50%,calc(-100% - 18px)) scale(1)}
#tip .b{font:700 15px/19px 'Hanken Grotesk'}
#tip .s{margin-top:3px;font:500 12px/16px 'Hanken Grotesk';color:#4A5A6D;display:flex;align-items:center;gap:6px}
#tip .v{margin-top:10px;display:flex;align-items:center;gap:8px;font:600 12px/16px 'Hanken Grotesk';color:#4A5A6D}
#tip .v em{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font:700 12px/1 'Hanken Grotesk';font-style:normal}
.flag{display:inline-flex;width:15px;height:10px;border-radius:2px;overflow:hidden;flex:none}
.credit{position:absolute;right:14px;bottom:10px;font:500 10px/1 'IBM Plex Mono';color:#454B57}
.arc{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.pin{cursor:pointer}
.pin .shape{transition:transform .2s cubic-bezier(.2,.9,.25,1.3);transform-box:fill-box;transform-origin:center}
.pin:hover .shape{transform:scale(1.35)}
@media (max-width:640px){.panel{left:12px;right:12px;top:12px;width:auto}}
@media (prefers-reduced-motion:reduce){.arc,.pulse{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <svg id="map"></svg>
  <div class="panel" id="panel">
    <div><div class="t">Where you bid</div><div class="m">HOME · LEIPZIG, DE</div></div>
    <div class="row" id="cross"><span>Bid outside Germany and Austria</span><span class="sw"><i></i></span></div>
    <div class="counts" id="counts"></div>
  </div>
  <div id="tip"></div>
  <div class="credit">Natural Earth · world-atlas</div>
</div>
<script>
const HOME = [12.37, 51.34];
const FLAGS = { DE: ['#111', '#DD0000', '#FFCE00', 0], AT: ['#C8102E', '#fff', '#C8102E', 0], ES: ['#AA151B', '#F1BF00', '#AA151B', 0], NL: ['#AE1C28', '#fff', '#21468B', 0], FR: ['#002654', '#fff', '#CE1126', 1] };
const OUT = 'Outside your countries';
const PINS = [
  { name: 'Ellerbach', buyer: 'Stadt Ellerbach', title: 'Structured cabling and Wi-Fi for 12 primary schools', cc: 'DE', at: [11.1, 50.55], lab: [-14, 4, 'end'], v: () => ['go', 100, 'Meets all 8 requirements'] },
  { name: 'Hohenau', buyer: 'Landkreis Hohenau', title: 'IT security audit', cc: 'DE', at: [12.9, 48.75], lab: [14, -2, 'start'], v: () => ['nogo', 25, 'Needs ISO 27001'] },
  { name: 'Kaltbrunn', buyer: 'Stadtwerke Kaltbrunn', title: 'Fibre-to-the-building rollout', cc: 'AT', at: [13.6, 47.35], lab: [14, 10, 'start'], v: () => ['maybe', 90, 'Short by 1 reference'] },
  { name: 'Vlietdam', buyer: 'Gemeente Vlietdam', title: 'Public Wi-Fi for 9 libraries', cc: 'NL', at: [4.6, 52.05], lab: [-14, 4, 'end'], v: c => c ? ['nogo', 25, 'VCA certificate mandatory'] : ['nogo', 20, OUT] },
  { name: 'Morlanne', buyer: 'Centre Hospitalier de Morlanne', title: 'IT support framework', cc: 'FR', at: [-0.5, 43.45], lab: [14, 4, 'start'], v: c => c ? ['nogo', 25, 'Needs €5M turnover'] : ['nogo', 20, OUT] },
  { name: 'Valdemora', buyer: 'Universidad de Valdemora', title: 'Data centre cabling, lot 2', cc: 'ES', at: [-3.9, 40.35], lab: [14, 4, 'start'], v: c => c ? ['maybe', 85, 'Bid must be in Spanish'] : ['nogo', 20, OUT] }
];
const HOMEIDS = ['276', '040'], CROSSIDS = ['724', '528', '250'];
const LABELS = [['DE', 9.3, 52.2, 'h'], ['AT', 16.1, 46.85, 'h'], ['NL', 5.7, 52.85, 'c'], ['FR', 2.4, 46.9, 'c'], ['ES', -5.4, 41.9, 'c']];
const COL = { go: '#1F9D63', maybe: '#F5A524', nogo: '#E5483B' }, ON = { go: '#fff', maybe: '#1A1200', nogo: '#fff' }, LBL = { go: 'Go', maybe: 'Maybe', nogo: 'No-go' };
let cross = true, world = null;
const svg = d3.select('#map'), tip = document.getElementById('tip');
const flag = cc => { const [a, b, c, v] = FLAGS[cc]; return `<span class="flag" style="flex-direction:${v ? 'row' : 'column'}"><i style="flex:1;background:${a}"></i><i style="flex:1;background:${b}"></i><i style="flex:1;background:${c}"></i></span>`; };

function mainland(f) {
  if (f.geometry.type !== 'MultiPolygon') return f;
  const polys = f.geometry.coordinates.filter(p => p[0].some(([lon, lat]) => lon > -20 && lon < 45 && lat > 34));
  return { ...f, geometry: { type: 'MultiPolygon', coordinates: polys } };
}

function counts() {
  const n = { go: 0, maybe: 0, nogo: 0 };
  PINS.forEach(p => n[p.v(cross)[0]]++);
  document.getElementById('counts').innerHTML = ['go', 'maybe', 'nogo'].map(k =>
    `<div style="flex:${Math.max(n[k], .6)};background:${COL[k]};color:${ON[k]}"><b>${n[k]}</b>${LBL[k]}</div>`).join('');
}

function draw() {
  if (!world) return;
  const w = innerWidth, h = innerHeight, wide = w > 640;
  svg.selectAll('*').remove();
  const proj = d3.geoConicConformal().parallels([40, 56]).rotate([-6, 0]);
  const focus = world.filter(f => HOMEIDS.includes(f.id) || CROSSIDS.includes(f.id));
  proj.fitExtent([[wide ? 300 : 24, wide ? 36 : 230], [w - 36, h - 30]], { type: 'FeatureCollection', features: focus });
  const path = d3.geoPath(proj);
  const defs = svg.append('defs');
  const glow = defs.append('radialGradient').attr('id', 'g');
  glow.append('stop').attr('offset', '0%').attr('stop-color', '#1A7AA3').attr('stop-opacity', .35);
  glow.append('stop').attr('offset', '100%').attr('stop-color', '#1A7AA3').attr('stop-opacity', 0);
  const [hx, hy] = proj(HOME);
  svg.append('circle').attr('cx', hx).attr('cy', hy).attr('r', Math.min(w, h) * .55).attr('fill', 'url(#g)');
  svg.append('path').attr('d', path(d3.geoGraticule().step([5, 5])())).attr('fill', 'none').attr('stroke', 'rgba(255,255,255,.035)').attr('stroke-width', 1);
  const isOn = f => HOMEIDS.includes(f.id) || (cross && CROSSIDS.includes(f.id));
  svg.append('g').selectAll('path').data(world).join('path').attr('d', path)
    .attr('fill', f => HOMEIDS.includes(f.id) ? '#183470' : isOn(f) ? '#13285A' : CROSSIDS.includes(f.id) ? '#121823' : '#0D1117')
    .attr('stroke', f => isOn(f) ? '#2C8FC0' : '#1A1F29').attr('stroke-width', f => isOn(f) ? 1 : .6).attr('stroke-linejoin', 'round');
  svg.append('g').selectAll('text').data(LABELS).join('text')
    .attr('x', d => proj([d[1], d[2]])[0]).attr('y', d => proj([d[1], d[2]])[1]).attr('text-anchor', 'middle')
    .text(d => d[0]).attr('fill', d => d[3] === 'h' || cross ? '#4F79B5' : '#2A303B')
    .style('font', "600 11px 'IBM Plex Mono'").style('letter-spacing', '.12em');
  const arcs = svg.append('g');
  PINS.forEach(p => {
    const [v] = p.v(cross), [x, y] = proj(p.at), dx = x - hx, dy = y - hy, d = Math.hypot(dx, dy);
    const cx = (hx + x) / 2 + (dy / d) * d * .2, cy = (hy + y) / 2 - (dx / d) * d * .2;
    arcs.append('path').attr('class', 'arc').attr('d', `M${hx},${hy} Q${cx},${cy} ${x},${y}`).attr('fill', 'none')
      .attr('stroke', v === 'nogo' ? 'rgba(229,72,59,.45)' : 'rgba(93,184,245,.7)').attr('stroke-width', 1.4)
      .attr('stroke-linecap', 'round').attr('stroke-dasharray', '1 6');
  });
  const home = svg.append('g').attr('transform', `translate(${hx},${hy})`);
  home.append('circle').attr('class', 'pulse').attr('r', 6).attr('fill', '#5DB8F5');
  home.append('circle').attr('r', 7).attr('fill', '#5DB8F5').attr('stroke', '#07090D').attr('stroke-width', 3);
  home.append('text').attr('x', 13).attr('y', -10).text('You · Leipzig').attr('fill', '#9AD3FA')
    .attr('stroke', '#07090D').attr('stroke-width', 4).attr('paint-order', 'stroke').style('font', "700 12px 'Hanken Grotesk'");
  PINS.forEach(p => {
    const [v, score, why] = p.v(cross), [x, y] = proj(p.at), [lx, ly, anchor] = p.lab;
    const g = svg.append('g').attr('class', 'pin').attr('transform', `translate(${x},${y})`);
    g.append('circle').attr('r', 20).attr('fill', 'transparent');
    const s = g.append('g').attr('class', 'shape');
    if (v === 'go') s.append('circle').attr('r', 8);
    else if (v === 'maybe') s.append('path').attr('d', 'M0,-9.5 L9.5,7 L-9.5,7Z');
    else s.append('rect').attr('x', -7).attr('y', -7).attr('width', 14).attr('height', 14).attr('rx', 1.5);
    s.selectAll('*').attr('fill', COL[v]).attr('stroke', '#07090D').attr('stroke-width', 2.5);
    const t = g.append('text').attr('x', lx).attr('y', ly - 6).attr('text-anchor', anchor).attr('stroke', '#07090D').attr('stroke-width', 4).attr('paint-order', 'stroke');
    t.append('tspan').text(p.name).attr('fill', '#E9EBEE').style('font', "700 12px 'Hanken Grotesk'");
    t.append('tspan').attr('x', lx).attr('dy', 14).text(`${LBL[v]} · ${score}`).attr('fill', COL[v] === '#E5483B' ? '#FF8B80' : COL[v] === '#F5A524' ? '#F7C25E' : '#5ED69C').style('font', "600 10px 'IBM Plex Mono'");
    g.on('mouseenter', () => {
      tip.innerHTML = `<div class="b">${p.title}</div><div class="s">${flag(p.cc)}${p.buyer}</div><div class="v"><em style="background:${COL[v]};color:${ON[v]}">${LBL[v]} · ${score}</em>${why}</div>`;
      tip.style.left = Math.min(Math.max(x, 125), w - 125) + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
    }).on('mouseleave', () => tip.classList.remove('on'));
  });
  counts();
}

document.getElementById('cross').addEventListener('click', () => { cross = !cross; document.getElementById('panel').classList.toggle('off', !cross); draw(); });
addEventListener('resize', draw);
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  world = topojson.feature(topo, topo.objects.countries).features.map(mainland);
  draw();
});
</script>
</body>
</html>
