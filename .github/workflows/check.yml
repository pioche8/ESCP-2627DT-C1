# Runs on every push and pull request. Two jobs, both required on main (repository ruleset, 5 Nov 2026):
#   check  node only, under a minute: engine tests, win/loss insights tests, data check, docs check (routes, story checks, interview
#          citations), demo pins, engine invariants, static declutter scan, WCAG AA audit, generated token files in sync, the site's
#          engine/data copies in sync, the Vercel app build (ADR-0001).
#   smoke  the Playwright click-through in Chromium at 390×844, dark + light + reduced motion, with the declutter scan on
#          every screen; on pull requests and on pushes to main, browser cached, about three minutes.
# The iPhone 13 / iPhone SE profiles and the site build stay local: `npm run preflight` (docs/START_HERE.md §4).
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests (24)
        run: node tests/engine.test.js
      - name: Win/loss insights tests (insights.js)
        run: node tests/insights.test.js
      - name: Data check (data.js against what engine.js and app.js read)
        run: node tests/data-check.js
      - name: Docs check (routes, story checks, interview citations)
        run: node tests/docs-check.js
      - name: Demo pins (Hohenau 25 → 90 → 100, storage key, reset)
        run: node tests/demo-golden.test.js
      - name: Engine invariants (seeded property test)
        run: node tests/engine-invariants.test.js
      - name: Declutter scan (static, five stylesheets)
        run: node tests/declutter-scan.js
      - name: WCAG AA audit of shared/tokens.json
        run: node shared/check-contrast.js
      - name: Generated token files match shared/tokens.json
        run: |
          node shared/build-tokens.js
          git diff --exit-code -- shared/tokens.css site/src/styles/tokens.css site/src/generated/tokens.ts
      - name: Generated decision-model files match engine.js and data.js
        run: |
          node shared/how-it-decides.js
          git diff --exit-code -- site/src/generated/how-it-decides.json docs/HOW_IT_DECIDES.md
      - name: The site's copies of engine.js and data.js are current (ADR-0001)
        run: node site/scripts/sync-shared.mjs --check
      - name: The Vercel app build serves exactly the app files (ADR-0001)
        run: node tests/vercel-dist.test.js

  smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (no package-lock, nothing saved)
        run: npm i --no-save --no-audit --no-fund playwright@${PLAYWRIGHT_VERSION}
      - name: Cache the Chromium build
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Download Chromium (cache miss only)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Chromium system libraries
        run: npx playwright install-deps chromium
      - name: Smoke test at 390×844 (dark + light + reduced motion)
        run: node tests/smoke.js screenshots
      - name: tests.html in Chromium (file:// and HTTP)
        run: node tests/browser-tests.js
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: screenshots/
          retention-days: 7
