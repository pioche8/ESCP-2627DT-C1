<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF3F8">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="TenderScout prototype: AI reads EU public tenders and tells small firms in one line whether they qualify.">
  <title>TenderScout</title>
  <script>
  /* Theme and palette before the first paint (no flash). app.js keeps them in sync afterwards. */
  (function () {
    var d = document.documentElement, t = 'light', p = 'brand';
    try {
      var s = JSON.parse(localStorage.getItem('tenderscout.v2') || '{}') || {};
      var q = new URLSearchParams(location.search).get('palette') || s.palette;
      if (q === 'sky' || q === 'harbor') p = q;
      if (s.theme === 'light' || s.theme === 'dark') t = s.theme;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    } catch (e) { /* private mode: defaults */ }
    d.setAttribute('data-v3', t); d.setAttribute('data-palette', p);
  })();
  </script>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:16px">TenderScout needs JavaScript.</p></noscript>
  <script src="engine.js"></script>
  <script src="data.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
</body>
</html>
